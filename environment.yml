name: spam-detection
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10
  
  # Data Science Stack
  - numpy>=1.26.0
  - pandas>=2.2.3
  - scikit-learn>=1.5.0
  - scipy>=1.10.0
  
  # Visualization
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  - plotly>=5.15.0
  
  # Machine Learning
  - imbalanced-learn>=0.11.0
  - xgboost>=1.7.0
  
  # Text Processing
  - nltk>=3.9.1
  - beautifulsoup4>=4.12
  - regex>=2023.6.3
  
  # Development Tools
  - jupyter>=1.0.0
  - ipykernel>=6.25.0
  - notebook>=6.5.0
  
  # Testing & Quality
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  - black>=23.0.0
  - isort>=5.12.0
  - flake8>=6.0.0
  
  # Utilities
  - setuptools>=68.0.0
  - pip>=23.0.0
  
  # Pip dependencies (not available via conda)
  - pip:
    - tensorflow>=2.15.0
    - tensorflow-hub>=0.15.0
    - transformers>=4.21.0
    - datasets>=2.14.0
    - wandb>=0.15.0
    - mlflow>=2.5.0
    - shap>=0.42.0
    - lime>=0.2.0
    - streamlit>=1.25.0
    - fastapi>=0.100.0
    - uvicorn>=0.23.0
    - pydantic>=2.0.0
    - pre-commit>=3.3.0

